<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko" th:fragment="navbar">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/navbar.css}">
<body>
<nav class="navbar navbar-expand-lg site-nav sticky-top border-bottom py-0">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-1 text-nowrap col-lg-3 me-0" th:href="@{/home}" aria-label="EcoGG 메인으로 이동">
            <img class="object-fit-contain" th:src="@{/images/eco-logo-cow.png}" alt="EcoGG 송아지 로고">
            <img th:src="@{/images/eco-logo.png}" alt="EcoGG 로고" class="brand-logo object-fit-contain">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav align-items-lg-center fw-bold col-lg-8 justify-content-center">
                <li class="nav-item"><a class="nav-link" th:href="@{/info}">정보</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/data}">데이터</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/product}">친환경제품</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/community}">커뮤니티</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/member/mypage}">마이페이지</a></li>
            </ul>
            <div class="d-flex col-lg-4 justify-content-lg-end align-items-center gap-3 mt-3 mt-lg-0">
            <th:block  th:if="${session.loginUser == null}">
                <span class="text-secondary d-none d-lg-inline">│</span>
                <a class="login-label fw-bold text-nowrap text-decoration-none" th:href="@{/member/login}">♙ 로그인</a>
                <a class="btn btn-join rounded-pill fw-bold" th:href="@{/member/enroll}">회원가입</a>
            </th:block>
            <th:block  th:unless="${session.loginUser == null}">
                <a class="login-label fw-bold text-nowrap text-decoration-none" th:href="@{/member/mypage}"><b>[[${session.loginUser.memberNickName}]]</b> 님, 환영합니다.</a>
                <span class="text-secondary d-none d-lg-inline">│</span>
                <a class="login-label fw-bold text-nowrap text-decoration-none" th:href="@{/member/logout}">로그아웃</a>
            </th:block>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
