<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<div th:replace="~{views/common/navbar :: navbar}"></div>
	<img th:src="@{/images/error-member.png}" class="w-100" alt="오류 안내 이미지">
	<div class="container text-center py-5">
		<h2 class="fw-bold mb-3">[[${errorMsg}]]</h2>
		<p class="text-secondary">잠시 후 다시 시도해 주세요.</p>
		<div class="d-flex justify-content-center gap-3">
			<a class="btn btn-join rounded-pill px-5 py-3 fw-bold mt-3" th:if="${errorType == 'ENROLL'}" th:href="@{/member/enroll}">다시 가입하기</a>
			<a class="btn btn-join rounded-pill px-5 py-3 fw-bold mt-3" th:if="${errorType == 'UPDATE'}" th:href="@{/member/update}">내 정보로 이동</a>
			<a class="btn btn-outline-primary rounded-pill px-5 py-3 fw-bold mt-3" th:href="@{/home}">메인으로 이동</a>
		</div>
	</div>
</body>
</html>
