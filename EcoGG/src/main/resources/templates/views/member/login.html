<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EcoGG | 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{views/common/navbar :: navbar}"></div>
    <main class="login-background flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container login-container">
            <div class="row align-items-center justify-content-center g-1">
                <div class="col-lg-5 d-flex justify-content-center justify-content-lg-end">
	                <div class="text-center">
	                    <img class="login-character img-fluid mb-4" th:src="@{/images/eco-earth.png}" alt="EcoGG 송아지">
	                    <h1 class="intro-title fw-bold mb-3">
	                        작은 실천이 만드는<br>
	                        지구의 <span>변화.</span>
	                    </h1>
	                    <p class="text-secondary mb-0">
	                        EcoGG와 함께하는 탄소중립 생활,<br>
	                        오늘부터 시작해 보세요!
	                    </p>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="login-card bg-white rounded-4 shadow-sm p-4 p-md-5 mx-auto">
                    	<a class="d-flex justify-content-center align-items-center gap-1 text-decoration-none mb-3" th:href="@{/home}">
						    <img th:src="@{/images/eco-logo-cow.png}" width="50" alt="EcoGG 로고">
						    <img th:src="@{/images/eco-logo.png}" alt="EcoGG 로고" width="120">
						</a>
                        <h2 class="fw-bold text-center mb-4">로그인</h2>
                        <form th:action="@{/member/login}" method="post">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="floatingInput" name="memberId" placeholder="아이디를 입력하세요" required>
                                <label for="floatingInput">아이디</label>
                            </div>
                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="floatingPassword"
                                       name="memberPwd" placeholder="비밀번호를 입력하세요" required>
                                <label for="floatingPassword">비밀번호</label>
                            </div>
                            <button class="w-100 btn btn-join rounded-pill py-3 fw-bold" type="submit">로그인</button>
                            <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
                                <a class="login-link" th:href="@{/member/enroll}">회원가입</a>
                                <span class="text-secondary">│</span>
                                <a class="login-link">아이디·비밀번호 찾기</a>
                            </div>
                            <input type="hidden" name="beforeURL">
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        window.onload = () => {
            document.getElementsByName('beforeURL')[0].value = document.referrer;
        }
    </script>

</body>
</html>
