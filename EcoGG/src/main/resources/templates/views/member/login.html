<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.orf">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link rel="stylesheet" th:href="@{/css/home.css}">
<style>
	html, body {height: 100%;}
	body {display: flex; align-items: center; padding-top: 40px; padding-bottom: 40px; background-color: #f5f5f5; flex-direction: column;}
	.form-signin {max-width: 330px; padding: 15px;}
	.form-signin .form-floating:focus-within {z-index: 2;}
	.form-signin input[type="email"] {margin-bottom: -1px; border-bottom-right-radius: 0; border-bottom-left-radius: 0;}
	.form-signin input[type="password"] {margin-bottom: 10px; border-top-left-radius: 0; border-top-right-radius: 0;}
	.form-signin a>label{color: black;}
	.form-signin a>label:hover{text-decoration: underline;}
</style>
</head>
<body class="text-center">
	<div th:replace="~{views/common/navbar :: navbar}"></div>
	<main class="form-signin w-100 m-auto">
		<form action="/member/login" method="post"> 
			<a href="/home"><img class="mb-4" src="/images/eco-earth.png" width="150"></a>
			<h1 class="h3 mb-3 fw-normal">로그인</h1>

			<div class="form-floating">
				<input type="text" class="form-control" id="floatingInput" name="memberId" placeholder="아이디를 입력하세요">
				<label for="floatingInput">ID</label>
			</div>
			<div class="form-floating">
				<input type="password" class="form-control" id="floatingPassword" name="memberPwd" placeholder="비밀번호를 입력하세요">
				<label for="floatingPassword">Password</label>
			</div>
			<button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button><br><br>
			<div class="mb-3">
				<a href="/member/enroll"><label>Sign up</label></a>
				&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
				<a><label>Find ID/PWD</label></a>
			</div>
			<input type="hidden" name="beforeURL"/>
		</form>
	</main>
	<script>
		window.onload = () => {
			document.getElementsByName('beforeURL')[0].value = document.referrer;
			// referrer 이전 url을 의미
		}
	</script>
</body>
</html>
