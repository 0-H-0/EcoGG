<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EcoGG | 친환경 제품</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">

    <style>
        body {
            background: #f7f9f7;
            color: #26352b;
        }

        .product-page {
            min-height: 70vh;
            padding: 56px 0 80px;
        }

        .product-heading {
            margin-bottom: 28px;
        }

        .product-heading .eyebrow {
            color: #4e8a60;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .product-heading h1 {
            margin: 8px 0;
            font-size: clamp(2rem, 4vw, 2.7rem);
            font-weight: 800;
        }

        .product-heading p {
            color: #6c786f;
        }

        .search-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
            padding: 18px;
            border: 1px solid #e4eae4;
            border-radius: 14px;
            background: #fff;
        }

        .search-panel select {
            max-width: 200px;
        }

        .product-card {
            height: 100%;
            padding: 22px;
            border: 1px solid #e4eae4;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(30, 60, 40, 0.05);
        }

        .product-category {
            display: inline-block;
            margin-bottom: 12px;
            padding: 5px 10px;
            border-radius: 999px;
            background: #eaf4ec;
            color: #327344;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .product-card h2 {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .product-card p {
            margin: 0;
            color: #6c786f;
            line-height: 1.7;
        }

        .empty-message {
            padding: 48px 16px;
            border: 1px solid #e4eae4;
            border-radius: 16px;
            background: #fff;
            color: #6c786f;
            text-align: center;
        }
    </style>
</head>

<body>
<div th:replace="~{views/common/navbar :: navbar}"></div>

<main class="product-page">
    <div class="container">
        <header class="product-heading">
            <div class="eyebrow">ECOGG / GREEN PRODUCTS</div>
            <h1>친환경 제품</h1>
            <p>카테고리나 검색어로 제품 정보를 찾아보세요.</p>
        </header>

        <form class="search-panel" method="get" th:action="@{/product/list}">
            <select class="form-select" name="category" aria-label="제품 카테고리">
                <option value="all"
                        th:selected="${selectedCategory == 'all'}">
                    전체 카테고리
                </option>
                <option th:each="category : ${categories}"
                        th:value="${category}"
                        th:text="${category}"
                        th:selected="${selectedCategory == category}">
                    카테고리
                </option>
            </select>

            <input class="form-control flex-grow-1"
                   type="search"
                   name="keyword"
                   placeholder="제품명이나 설명 검색"
                   th:value="${keyword}"
                   aria-label="검색어">

            <button class="btn btn-success" type="submit">검색</button>
            <a class="btn btn-outline-secondary" th:href="@{/product/list}">초기화</a>
        </form>

        <section class="row g-3" aria-label="친환경 제품 목록">
            <div class="col-md-6 col-lg-4" th:each="product : ${products}">
                <article class="product-card">
                    <span class="product-category"
                          th:text="${product.productNo}">생활용품</span>
                    <h2 th:text="${product.productName}">제품명</h2>
                    <p th:text="${product.productDetail}">제품 설명</p>
                </article>
            </div>
        </section>
					<nav class="mt-4"
			     aria-label="제품 목록 페이지"
			     th:if="${totalPages > 1}">
			    <ul class="pagination justify-content-center">
			
			        <li class="page-item" th:classappend="${currentPage == 1} ? ' disabled'">
			            <span class="page-link" th:if="${currentPage == 1}">이전</span>
			            <a class="page-link"
			               th:unless="${currentPage == 1}"
			               th:href="@{/product/list(category=${selectedCategory}, keyword=${keyword}, page=${currentPage - 1})}">
			                이전
			            </a>
			        </li>
			
			        <li class="page-item"
			            th:each="pageNumber : ${pageNumbers}"
			            th:classappend="${currentPage == pageNumber} ? ' active'">
			            <a class="page-link"
			               th:href="@{/product/list(category=${selectedCategory}, keyword=${keyword}, page=${pageNumber})}"
			               th:text="${pageNumber}">
			                1
			            </a>
			        </li>
			
			        <li class="page-item"
			            th:classappend="${currentPage == totalPages} ? ' disabled'">
			            <span class="page-link" th:if="${currentPage == totalPages}">다음</span>
			            <a class="page-link"
			               th:unless="${currentPage == totalPages}"
			               th:href="@{/product/list(category=${selectedCategory}, keyword=${keyword}, page=${currentPage + 1})}">
			                다음
			            </a>
			        </li>
			
			    </ul>
			</nav>
        <div class="empty-message mt-3" th:if="${#lists.isEmpty(products)}">
            조건에 맞는 제품이 없습니다. 카테고리나 검색어를 바꿔 보세요.
        </div>
    </div>
</main>
</body>
</html>
